<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeTweak</title>
    <link rel="stylesheet" href="/assets/styles/popup.css" />
    <link rel="stylesheet" href="/assets/styles/user_scripts_banner.css" />
    <script src="../shared/utils/theme_manager.js"></script>
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <div class="logo-container">
        <img class="logo" src="/assets/icons/icon32.png" alt="CodeTweak" />
      </div>
      <div class="buttons">
        <button id="openDashboard" class="primary">
          <span class="btn-icon">
            <span data-icon="grid"></span>
          </span>
        </button>
        <button id="createScript" class="primary">
          <span class="btn-icon">
            <span data-icon="plus"></span>
          </span>
        </button>
      </div>
    </header>

    <div id="userScriptsBannerSlot"></div>

    <div class="main-content">
      <div class="script-list" id="scriptList">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">
            <span data-icon="file-text"></span>
          </div>
        </div>
      </div>

      <!-- Menu Commands Section -->
      <div class="menu-command-section" id="menuCommandSection" style="display: none">
        <div class="menu-command-title" data-i18n="popupMenuCommands">Menu Commands</div>
        <div class="menu-command-list" id="menuCommandList"></div>
      </div>
    </div>

    <footer>
      <div id="extensionVersion"></div>
      <div>
        <a
          href="https://github.com/MrBlankCoding/CodeTweak/issues/new"
          id="reportIssue"
          data-i18n="popupReportIssue"
          >Report Issue</a
        >
      </div>
    </footer>
  </body>
</html>
